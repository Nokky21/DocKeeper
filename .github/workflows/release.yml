name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag matches the version
        run: |
          VERSION="$(python bin/dockeeper --version | awk '{print $2}')"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $VERSION"; exit 1; }
      - name: Tests
        run: python -m unittest
      - name: Skill ZIP (folder named like the skill, as the Agent Skills standard requires)
        run: |
          mkdir -p dist/dockeeper
          cp -R SKILL.md LICENSE README.md bin dockeeper templates dist/dockeeper/
          find dist -name __pycache__ -prune -exec rm -rf {} +
          cd dist && zip -qr dockeeper-skill.zip dockeeper
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/dockeeper-skill.zip
          generate_release_notes: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="How DocKeeper works: a claim in your docs is anchored to a code block, the block is fingerprinted, and check reports OK, MOVED or CHANGED">

<style>
  .bg { fill: #fffdf8; stroke: #dcd7cb; }
  .card { fill: #f7f5f0; stroke: #dcd7cb; }
  .bar { fill: #efece4; }
  .rule { stroke: #dcd7cb; stroke-width: 1; }
  .t { fill: #47433b; font: 400 13px "Geist", "Geist Variable", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .tb { fill: #1d1b17; font: 500 18px "Newsreader", "Iowan Old Style", Georgia, serif; }
  .muted { fill: #7a7468; font: 400 12px "Geist", "Geist Variable", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .num { fill: #7a7468; font: 400 18px "Newsreader", "Iowan Old Style", Georgia, serif; }
  .step { fill: #47433b; font: 500 13px "Geist", "Geist Variable", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .m { fill: #1d1b17; font: 12px "Geist Mono", "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ms { fill: #7a7468; font: 11px "Geist Mono", "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .vc { font: 600 12.5px "Geist Mono", "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .acc { fill: #1f4e8c; }
  .hl { fill: #1f4e8c; fill-opacity: .08; }
  .arrow { stroke: #cbc5b6; stroke-width: 1.4; fill: none; }
  .head { fill: #cbc5b6; }
  .ok { fill: #2f7a4b; } .mv { fill: #956510; } .ch { fill: #b23a2e; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1d1c19; stroke: #2f2c27; }
    .card { fill: #151412; stroke: #2f2c27; }
    .bar { fill: #1b1a17; }
    .rule { stroke: #2f2c27; }
    .tb, .m { fill: #ece8df; }
    .t, .step { fill: #c4bfb3; }
    .muted, .ms, .num { fill: #918b7e; }
    .acc { fill: #8fb3e8; }
    .hl { fill: #8fb3e8; fill-opacity: .1; }
    .arrow { stroke: #403c35; } .head { fill: #403c35; }
    .ok { fill: #6cc08b; } .mv { fill: #d9a64a; } .ch { fill: #e57565; }
  }
</style>

<rect class="bg" x="0.5" y="0.5" width="959" height="329" rx="14"/>
<text class="num" x="24" y="38">1</text><text class="step" x="40" y="37">Write the claim</text>
<text class="num" x="272" y="38">2</text><text class="step" x="288" y="37">Anchor the whole block</text>
<text class="num" x="536" y="38">3</text><text class="step" x="552" y="37">Seal</text>
<text class="num" x="740" y="38">4</text><text class="step" x="756" y="37">Check</text>
<rect class="card" x="24" y="52" width="214" height="250" rx="10"/><path class="bar" d="M25 80 V62 a9 9 0 0 1 9 -9 H228 a9 9 0 0 1 9 9 V80 z"/><path class="rule" d="M25 80.5 H237"/><text class="ms" x="36" y="71">docs/payments.md</text>
<text class="tb" x="38" y="102" xml:space="preserve">Payments</text>
<text class="t" x="38" y="132" xml:space="preserve">Every payment is validated</text><text class="t" x="38" y="151" xml:space="preserve">before it is charged</text>
<rect class="hl" x="34" y="176" width="194" height="46" rx="3"/><rect class="acc" x="34" y="176" width="2" height="46"/>
<text class="m acc" x="44" y="195" xml:space="preserve">[[src/payments.py</text><text class="m acc" x="44" y="213" xml:space="preserve">#validate_payment]]</text>
<text class="muted" x="38" y="284" xml:space="preserve">one anchor per claim</text>
<rect class="card" x="272" y="52" width="230" height="250" rx="10"/><path class="bar" d="M273 80 V62 a9 9 0 0 1 9 -9 H492 a9 9 0 0 1 9 9 V80 z"/><path class="rule" d="M273 80.5 H501"/><text class="ms" x="284" y="71">src/payments.py</text>
<text class="m" x="286" y="100" xml:space="preserve">import os</text>
<rect class="hl" x="280" y="114" width="214" height="94" rx="3"/><rect class="acc" x="280" y="114" width="2" height="94"/>
<text class="m" x="292" y="134" xml:space="preserve">def validate_payment(p):</text><text class="m" x="292" y="153" xml:space="preserve">  if p[&quot;amount&quot;] &lt;= 0:</text><text class="m" x="292" y="172" xml:space="preserve">    raise ValueError()</text><text class="m" x="292" y="191" xml:space="preserve">  return True</text>
<text class="m" x="286" y="230" xml:space="preserve">def charge(p): …</text>
<text class="muted" x="286" y="284" xml:space="preserve">the enclosing function, entire</text>
<rect class="card" x="536" y="52" width="170" height="250" rx="10"/><path class="bar" d="M537 80 V62 a9 9 0 0 1 9 -9 H696 a9 9 0 0 1 9 9 V80 z"/><path class="rule" d="M537 80.5 H705"/><text class="ms" x="548" y="71">.dockeeper.sello.json</text>
<text class="t" x="550" y="100" xml:space="preserve">normalize:</text><text class="t" x="550" y="119" xml:space="preserve">no extra spaces,</text><text class="t" x="550" y="138" xml:space="preserve">no blank lines</text>
<text class="muted" x="550" y="178" xml:space="preserve">sha-256 →</text>
<text class="m acc" x="550" y="200" xml:space="preserve">06d5eca737fe9faf</text>
<text class="muted" x="550" y="284" xml:space="preserve">hashes, never code</text>
<rect class="card" x="740" y="52" width="196" height="250" rx="10"/><path class="bar" d="M741 80 V62 a9 9 0 0 1 9 -9 H926 a9 9 0 0 1 9 9 V80 z"/><path class="rule" d="M741 80.5 H935"/><text class="ms" x="752" y="71">dockeeper check</text>
<rect class="ok" x="752" y="88" width="2" height="46"/>
<text class="vc ok" x="764" y="106">OK</text>
<text class="ms" x="924" y="106" text-anchor="end">exit 0</text>
<text class="muted" x="764" y="126" xml:space="preserve">same block, same place</text>
<path class="rule" d="M752 147.5 H924"/>
<rect class="mv" x="752" y="160" width="2" height="46"/>
<text class="vc mv" x="764" y="178">MOVED</text>
<text class="ms" x="924" y="178" text-anchor="end">exit 0</text>
<text class="muted" x="764" y="198" xml:space="preserve">found elsewhere: fix it</text>
<path class="rule" d="M752 219.5 H924"/>
<rect class="ch" x="752" y="232" width="2" height="46"/>
<text class="vc ch" x="764" y="250">CHANGED</text>
<text class="ms" x="924" y="250" text-anchor="end">exit 1</text>
<text class="muted" x="764" y="270" xml:space="preserve">gone: a human reviews</text>
<path class="arrow" d="M240 199 H263"/><path class="head" d="M270 199 l-7 -4 v8 z"/>
<path class="arrow" d="M504 161 H527"/><path class="head" d="M534 161 l-7 -4 v8 z"/>
<path class="arrow" d="M708 161 H731"/><path class="head" d="M738 161 l-7 -4 v8 z"/>
</svg>
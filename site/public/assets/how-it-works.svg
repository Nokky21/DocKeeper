<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="How DocKeeper works: a claim in your docs is anchored to a code block, the block is fingerprinted, and check reports OK, MOVED or CHANGED">

<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .card { fill: #f6f8fa; stroke: #d0d7de; }
  .bar { fill: #eaeef2; }
  .t { fill: #1f2328; font: 500 13px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .tb { fill: #1f2328; font: 650 14px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .muted { fill: #59636e; font: 500 12px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .step { fill: #59636e; font: 650 11px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .08em; }
  .m { fill: #1f2328; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ms { fill: #59636e; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .acc { fill: #0969da; }
  .hl { fill: #ddf4ff; stroke: #54aeff; }
  .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
  .head { fill: #8c959f; }
  .ok { fill: #1a7f37; } .okbg { fill: #dafbe1; stroke: #4ac26b; }
  .mv { fill: #9a6700; } .mvbg { fill: #fff8c5; stroke: #d4a72c; }
  .ch { fill: #cf222e; } .chbg { fill: #ffebe9; stroke: #ff8182; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .card { fill: #161b22; stroke: #30363d; }
    .bar { fill: #21262d; }
    .t, .tb, .m { fill: #e6edf3; }
    .muted, .step, .ms { fill: #9198a1; }
    .acc { fill: #4493f8; }
    .hl { fill: #0c2d6b; stroke: #1f6feb; }
    .arrow { stroke: #6e7681; } .head { fill: #6e7681; }
    .ok { fill: #3fb950; } .okbg { fill: #0f2e1a; stroke: #238636; }
    .mv { fill: #d29922; } .mvbg { fill: #2e2510; stroke: #9e6a03; }
    .ch { fill: #f85149; } .chbg { fill: #3a1418; stroke: #da3633; }
  }
</style>

<rect class="bg" x="0.5" y="0.5" width="959" height="329" rx="16"/>
<text class="step" x="24" y="36">1 · WRITE THE CLAIM</text>
<text class="step" x="272" y="36">2 · ANCHOR → WHOLE BLOCK</text>
<text class="step" x="536" y="36">3 · SEAL</text>
<text class="step" x="740" y="36">4 · CHECK</text>
<rect class="card" x="24" y="52" width="214" height="250" rx="10"/><path class="bar" d="M25 80 V62 a9 9 0 0 1 9 -9 H228 a9 9 0 0 1 9 9 V80 z"/><text class="ms" x="36" y="71">docs/payments.md</text>
<text class="tb" x="38" y="104" xml:space="preserve"># Payments</text>
<text class="t" x="38" y="134" xml:space="preserve">Every payment is validated</text><text class="t" x="38" y="153" xml:space="preserve">before it is charged</text>
<rect class="hl" x="34" y="182" width="194" height="46" rx="6"/>
<text class="m acc" x="44" y="201" xml:space="preserve">[[src/payments.py</text><text class="m acc" x="44" y="219" xml:space="preserve">#validate_payment]]</text>
<text class="muted" x="38" y="262" xml:space="preserve">one anchor per claim</text>
<rect class="card" x="272" y="52" width="230" height="250" rx="10"/><path class="bar" d="M273 80 V62 a9 9 0 0 1 9 -9 H492 a9 9 0 0 1 9 9 V80 z"/><text class="ms" x="284" y="71">src/payments.py</text>
<text class="m" x="286" y="100" xml:space="preserve">import os</text>
<rect class="hl" x="280" y="116" width="214" height="94" rx="6"/>
<text class="m" x="290" y="136" xml:space="preserve">def validate_payment(p):</text><text class="m" x="290" y="155" xml:space="preserve">  if p[&quot;amount&quot;] &lt;= 0:</text><text class="m" x="290" y="174" xml:space="preserve">    raise ValueError()</text><text class="m" x="290" y="193" xml:space="preserve">  return True</text>
<text class="m" x="286" y="230" xml:space="preserve">def charge(p): …</text>
<text class="muted" x="286" y="262" xml:space="preserve">the enclosing function, entire</text>
<rect class="card" x="536" y="52" width="170" height="250" rx="10"/><path class="bar" d="M537 80 V62 a9 9 0 0 1 9 -9 H696 a9 9 0 0 1 9 9 V80 z"/><text class="ms" x="548" y="71">.dockeeper.sello.json</text>
<text class="t" x="550" y="96" xml:space="preserve">normalize:</text><text class="t" x="550" y="115" xml:space="preserve">no extra spaces,</text><text class="t" x="550" y="134" xml:space="preserve">no blank lines</text>
<text class="muted" x="550" y="178" xml:space="preserve">sha-256 →</text>
<text class="m acc" x="550" y="200" xml:space="preserve">06d5eca737fe9faf</text>
<text class="muted" x="550" y="262" xml:space="preserve">hashes, never code</text>
<rect class="okbg" x="740" y="56" width="196" height="68" rx="10"/>
<text class="tb ok" x="756" y="84">OK</text>
<text class="muted" x="756" y="106" xml:space="preserve">same block, same place</text>
<rect class="mvbg" x="740" y="138" width="196" height="68" rx="10"/>
<text class="tb mv" x="756" y="166">MOVED</text>
<text class="muted" x="756" y="188" xml:space="preserve">found elsewhere: fix it</text>
<rect class="chbg" x="740" y="220" width="196" height="68" rx="10"/>
<text class="tb ch" x="756" y="248">CHANGED</text>
<text class="muted" x="756" y="270" xml:space="preserve">gone: a human reviews</text>
<path class="arrow" d="M240 205 H263"/><path class="head" d="M270 205 l-8 -5 v10 z"/>
<path class="arrow" d="M504 160 H527"/><path class="head" d="M534 160 l-8 -5 v10 z"/>
<path class="arrow" d="M708 160 H731"/><path class="head" d="M738 160 l-8 -5 v10 z"/>
</svg>